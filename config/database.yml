# PostgreSQL. Managed here via pgAdmin.
#   gem install pg
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: xr_centrale_one_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: xr_centrale_one_test

production:
  primary:
    <<: *default
    database: xr_centrale_one_production
  cache:
    <<: *default
    database: xr_centrale_one_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: xr_centrale_one_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: xr_centrale_one_production_cable
    migrations_paths: db/cable_migrate
